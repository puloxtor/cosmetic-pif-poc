name: CI

# Findings G1 + R8: тестовете (вкл. test_validation_log_guard) се пускат на всеки
# push/PR, за да не може регулаторна регресия или нарушен контракт да минат тихо.
on:
  push:
    branches: ["claude/epic-mccarthy-nW68A"]
  pull_request:
    branches: ["claude/epic-mccarthy-nW68A"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (with extraction extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[extraction]" pytest
      - name: Run tests
        run: python -m pytest tests/ -v
