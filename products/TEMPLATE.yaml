# ШАБЛОН ЗА ПРОДУКТ — копирай този файл и попълни за нов продукт.
# Това е целта на Задача 3 от roadmap-а: вход без редактиране на Python код.
# (Засега зареждащият код за YAML още НЕ е написан — това е една от
#  първите задачи, които ще свършиш с Claude Code. Виж ROADMAP.md, Задача 3.)

product:
  name: "Примерен продукт"
  cpnp_code: ""
  product_type: "rinse-off"        # rinse-off | leave-on
  applied_amount_g: 10.46          # приложено количество (g/ден)
  retention_factor: 0.01           # 0.01 за rinse-off, до 1.0 за leave-on
  body_weight_kg: 60.0
  sale_countries: ["BG"]

# Формула: всеки ред е INCI име + концентрация + (по избор) токсикология/алергени
formula:
  - inci_name: "Aqua"
    cas: "7732-18-5"
    function: "разтворител"
    concentration_pct: 28.15
    has_sds: true
    has_coa: true

  - inci_name: "Citrus Grandis Peel Oil"
    cas: "90045-43-5"
    function: "балсам за кожа"
    concentration_pct: 0.30
    is_fragrance: true
    has_sds: true
    has_coa: true
    has_ifra: true
    allergens:
      - name: "Limonene"
        cas: "5989-27-5"
        fraction: 0.90            # масов дял на алергена в този компонент

  - inci_name: "Phenoxyethanol"
    cas: "122-99-6"
    function: "консервант"
    concentration_pct: 0.40
    restricted: true
    max_allowed_pct: 1.0
    has_sds: true
    has_coa: true
    tox:
      pod: 400.0                  # ИСТИНСКАТА стойност от досието, не измислена!
      dermal_absorption: 0.50     # DAp дял (0.50 = 50% по подразбиране SCCS)

claims:
  - "Подходящ за честа употреба"
  - "Без сулфати"                 # ще се блокира (денигрираща)
