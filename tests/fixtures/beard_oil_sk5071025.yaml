# РЕГРЕСИОНЕН ФИКСТУР (НЕ е доставян продукт) — само за тест.
# Реален пример "Beard oil" (код СК 5071025), използван за валидиране на
# композиционния компилатор. Кодиран БУКВАЛНО по рецептата:
#   и Oleophen, и Vegelight влизат по 3% → сумата става 103% (нарочно, за да
#   се тества алармата). Не нормализираме тихо.
# Парфюмът е дозиран на 3%, докато Symrise Safety Evaluation е за 1.5% —
# оценката за безопасност НЕ покрива тази доза (флаг за оценителя).
# БЕЗ tox: доставчиците не дават NOAEL/PoD — не измисляме стойности.

